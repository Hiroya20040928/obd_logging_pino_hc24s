name: Build unsigned iPhone IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.5.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          elif [ -d /Applications/Xcode_26.4.1.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Run protocol decoder tests
        shell: bash
        run: |
          set -euo pipefail
          cd CoreValidation
          swift test

      - name: Build device app without code signing
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build Payload
          xcodebuild \
            -project PinoAutoLogger.xcodeproj \
            -target PinoAutoLogger \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            CONFIGURATION_BUILD_DIR="$PWD/build" \
            build
          test -d build/PinoAutoLogger.app

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R build/PinoAutoLogger.app Payload/
          /usr/bin/zip -qry PinoAutoLogger-HC24S-unsigned.ipa Payload
          shasum -a 256 PinoAutoLogger-HC24S-unsigned.ipa | tee PinoAutoLogger-HC24S-unsigned.sha256

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PinoAutoLogger-HC24S-unsigned-IPA
          path: |
            PinoAutoLogger-HC24S-unsigned.ipa
            PinoAutoLogger-HC24S-unsigned.sha256
          retention-days: 30
